[project]
name = "simple-fill-image-edit"
version = "1.1.0"
description = "Region-first local image editing with optional SAM3 refinement, native masks, and Inpaint Anything crop restoration."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Nobody-ly"}]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest-tmp"
pythonpath = ["."]
